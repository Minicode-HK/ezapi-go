<header class="bg-white shadow-sm px-8 py-4">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Snapshot Manager</h2>
            <p class="text-sm text-gray-600 mt-1">Save and restore your data</p>
        </div>
    </div>
</header>

<div class="p-8">
    <!-- Save Snapshot Section -->
    <div class="bg-white rounded-lg shadow-sm p-6 mb-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-save mr-2 text-green-600"></i>Save Snapshot
        </h3>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Module Selection -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Select Modules to Save
                </label>
                <div class="space-y-2 mb-4" id="module-checkboxes">
                    <!-- Dynamically populated -->
                </div>
                <button onclick="selectAllModules()" class="text-sm text-gray-800 hover:underline">
                    <i class="fas fa-check-double mr-1"></i> Select All
                </button>
                <span class="mx-2">|</span>
                <button onclick="deselectAllModules()" class="text-sm text-gray-800 hover:underline">
                    <i class="fas fa-times mr-1"></i> Deselect All
                </button>
            </div>

            <!-- Save Options -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Filename (optional)
                </label>
                <input type="text" id="snapshot-filename" placeholder="Leave empty for auto-generated name"
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-gray-800 mb-4">

                <button onclick="saveSnapshot()"
                    class="w-full bg-gray-800 text-white py-2 px-4 rounded-lg hover:bg-gray-700 transition-colors flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i>
                    <span>Save Snapshot</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Load Snapshot Section -->
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h3 class="text-lg font-semibold text-gray-900 mb-4">
            <i class="fas fa-folder-open mr-2 text-blue-600"></i>Available Snapshots
        </h3>

        <div id="snapshots-list">
            <!-- Dynamically populated -->
        </div>
    </div>
</div>

<script>
    (function () {
        let modules = [];
        let snapshots = [];

        // Load modules
        async function loadModules () {
            const response = await fetch('/cms/api/snapshots/modules', {
                credentials: 'include'
            });
            const result = await response.json();

            if (result.success) {
                modules = result.data;
                renderModuleCheckboxes();
            }
        }

        // Render module checkboxes
        function renderModuleCheckboxes () {
            const container = document.getElementById('module-checkboxes');
            container.innerHTML = modules.map((module, index) => `
                <label class="flex items-center p-3 bg-gray-50 rounded-lg hover:bg-gray-100 cursor-pointer">
                    <input type="checkbox" 
                           value="${module.name}" 
                           id="module-${index}"
                           class="module-checkbox mr-3 h-4 w-4 text-gray-800 rounded">
                    <div class="flex-1">
                        <span class="font-medium text-gray-900">${module.name}</span>
                        <span class="text-sm text-gray-500 ml-2">(${module.count} records)</span>
                    </div>
                </label>
            `).join('');
        }

        // Select/Deselect all
        window.selectAllModules = function () {
            document.querySelectorAll('.module-checkbox').forEach(cb => cb.checked = true);
        };

        window.deselectAllModules = function () {
            document.querySelectorAll('.module-checkbox').forEach(cb => cb.checked = false);
        };

        // Save snapshot
        window.saveSnapshot = async function () {
            const selectedModules = Array.from(document.querySelectorAll('.module-checkbox:checked'))
                .map(cb => cb.value);

            if (selectedModules.length === 0) {
                alert('Please select at least one module');
                return;
            }

            const filename = document.getElementById('snapshot-filename').value.trim();

            try {
                const response = await fetch('/cms/api/snapshots/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        modules: selectedModules,
                        filename: filename
                    })
                });

                const result = await response.json();

                if (result.success) {
                    showNotification(`Snapshot saved: ${result.filename}`, 'success');
                    document.getElementById('snapshot-filename').value = '';
                    loadSnapshots();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        };

        // Load snapshots
        async function loadSnapshots () {
            const response = await fetch('/cms/api/snapshots', {
                credentials: 'include'
            });
            const result = await response.json();

            if (result.success) {
                snapshots = result.data;
                renderSnapshots();
            }
        }

        // Render snapshots
        function renderSnapshots () {
            const container = document.getElementById('snapshots-list');

            if (snapshots.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-500">
                        <i class="fas fa-inbox text-4xl mb-3"></i>
                        <p>No snapshots found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Filename</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Modules</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Date</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Size</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${snapshots.map(snapshot => `
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 text-sm font-medium text-gray-900">
                                        <i class="fas fa-file-archive mr-2 text-gray-600"></i>
                                        ${snapshot.filename}
                                    </td>
                                    <td class="px-6 py-4 text-sm text-gray-600">
                                        ${snapshot.modules ? snapshot.modules.join(', ') : 'Unknown'}
                                    </td>
                                    <td class="px-6 py-4 text-sm text-gray-600">
                                        ${new Date(snapshot.modified).toLocaleString()}
                                    </td>
                                    <td class="px-6 py-4 text-sm text-gray-600">
                                        ${formatBytes(snapshot.size)}
                                    </td>
                                    <td class="px-6 py-4 text-sm text-right space-x-2">
                                        <button onclick='previewSnapshot("${snapshot.filename}")' 
                                                class="text-gray-600 hover:text-gray-900"
                                                title="Preview">
                                            <i class="fas fa-eye"></i>
                                        </button>
                                        <button onclick='showLoadModal(${JSON.stringify(snapshot)})' 
                                                class="text-blue-600 hover:text-blue-900"
                                                title="Load">
                                            <i class="fas fa-upload"></i>
                                        </button>
                                        <button onclick='downloadSnapshot("${snapshot.filename}")' 
                                                class="text-green-600 hover:text-green-900"
                                                title="Download">
                                            <i class="fas fa-download"></i>
                                        </button>
                                        <button onclick='deleteSnapshot("${snapshot.filename}")' 
                                                class="text-red-600 hover:text-red-900"
                                                title="Delete">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // Preview, load, delete functions (same as before)
        window.previewSnapshot = async function (filename) {
            // ... same implementation
        };

        window.downloadSnapshot = function (filename) {
            window.open(`/snapshots/${filename}`, '_blank');
        };

        window.showLoadModal = function (snapshot) {
            // ... same implementation
        };

        window.deleteSnapshot = async function (filename) {
            if (!confirm(`Are you sure you want to delete "${filename}"?`)) {
                return;
            }

            try {
                const response = await fetch(`/cms/api/snapshots/${filename}`, {
                    method: 'DELETE',
                    credentials: 'include'
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('Snapshot deleted', 'success');
                    loadSnapshots();
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Network error: ' + error.message);
            }
        };

        function formatBytes (bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showNotification (message, type = 'success') {
            const bgColor = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';

            const notification = document.createElement('div');
            notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2`;
            notification.innerHTML = `
                <i class="fas ${icon}"></i>
                <span>${message}</span>
            `;

            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.opacity = '0';
                notification.style.transition = 'opacity 0.3s';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Initialize
        loadModules();
        loadSnapshots();
    })();
</script>
