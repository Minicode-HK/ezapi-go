<header class="bg-white shadow-sm px-8 py-4">
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800" id="page-title">{{ .moduleName }}</h2>
            <p class="text-sm text-gray-600 mt-1" id="page-subtitle">Manage {{ .moduleName }} records</p>
        </div>
        <div class="flex gap-2">
            <button onclick="window.mockDataModal.show()"
                class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition-colors flex items-center">
                <i class="fas fa-magic mr-2"></i>
                Generate Mock Data
            </button>
        </div>
    </div>
</header>

<div class="p-8">
    <div id="content-area">
        <div class="text-center py-12">
            <i class="fas fa-spinner fa-spin text-4xl text-gray-400 mb-4"></i>
            <p class="text-gray-600">Loading {{ .moduleName }}...</p>
        </div>
    </div>
</div>

<!-- Mock Data Generator Modal -->
<div id="mock-data-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="bg-black opacity-50 absolute inset-0 z-[10]"></div>
    <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto z-[99]">
        <!-- Modal Header -->
        <div class="bg-gradient-to-r from-gray-600 to-indigo-700 px-6 py-4 flex items-center justify-between">
            <h3 class="text-xl font-bold text-white flex items-center">
                <i class="fas fa-magic mr-2"></i>
                Generate Mock Data
            </h3>
            <button onclick="window.mockDataModal.hide()" class="text-white hover:text-gray-200">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <!-- Modal Body -->
        <div class="p-6">
            <!-- Info -->
            <div class="bg-blue-50 border border-blue-200 rounded-lg p-4 mb-6">
                <div class="flex items-start gap-3">
                    <i class="fas fa-info-circle text-blue-600 mt-0.5"></i>
                    <div>
                        <h4 class="font-semibold text-blue-900 text-sm">Smart Mock Data Generation</h4>
                        <p class="text-xs text-blue-700 mt-1">
                            We'll automatically generate realistic data based on your field names and types.
                            Preview a sample before generating!
                        </p>
                    </div>
                </div>
            </div>

            <!-- Count Input -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    Number of Records
                </label>
                <div class="flex gap-4 items-center">
                    <input type="range" id="mock-count-range" min="1" max="1000" value="10"
                        class="flex-1 h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-purple-600">
                    <input type="number" id="mock-count-input" min="1" max="1000" value="10"
                        class="w-24 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
                </div>
                <div class="flex justify-between text-xs text-gray-500 mt-1">
                    <span>1</span>
                    <span>1000</span>
                </div>
            </div>

            <!-- Preview Section -->
            <div class="mb-6">
                <div class="flex items-center justify-between mb-3">
                    <label class="block text-sm font-medium text-gray-700">
                        Sample Preview
                    </label>
                    <button onclick="window.mockDataModal.loadPreview()"
                        class="text-sm text-gray-600 hover:text-gray-800">
                        <i class="fas fa-sync-alt mr-1"></i>Refresh Sample
                    </button>
                </div>
                <div id="mock-preview" class="bg-gray-50 rounded-lg p-4 border border-gray-200">
                    <div class="text-center py-4 text-gray-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p class="text-sm">Loading preview...</p>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-3">
                <button onclick="window.mockDataModal.hide()"
                    class="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition-colors">
                    Cancel
                </button>
                <button onclick="window.mockDataModal.generate()" style="cursor: pointer;"
                    class="flex-1 px-4 py-2 bg-gray-800 text-white rounded-lg hover:bg-gray-600 transition-colors flex items-center justify-center">
                    <i class="fas fa-magic mr-2"></i>
                    Generate Data
                </button>
            </div>
        </div>
    </div>
</div>

<script defer>
    (async () => {
        const moduleName = "{{ .moduleName }}";
        currentModule = new CMSModule();
        await currentModule.setModule(moduleName);

        // Initialize Mock Data Modal
        window.mockDataModal = {
            moduleName: moduleName,

            show () {
                document.getElementById('mock-data-modal').classList.remove('hidden');
                this.loadPreview();
                this.syncInputs();
            },

            hide () {
                document.getElementById('mock-data-modal').classList.add('hidden');
            },

            syncInputs () {
                const rangeInput = document.getElementById('mock-count-range');
                const numberInput = document.getElementById('mock-count-input');

                rangeInput.addEventListener('input', (e) => {
                    numberInput.value = e.target.value;
                });

                numberInput.addEventListener('input', (e) => {
                    const value = Math.max(1, Math.min(1000, parseInt(e.target.value) || 1));
                    numberInput.value = value;
                    rangeInput.value = value;
                });
            },

            async loadPreview () {
                const previewEl = document.getElementById('mock-preview');
                previewEl.innerHTML = `
                    <div class="text-center py-4 text-gray-400">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i>
                        <p class="text-sm">Loading preview...</p>
                    </div>
                `;

                try {
                    const response = await fetch(`/cms/api/mockdata/preview/${this.moduleName}`);
                    const result = await response.json();

                    if (result.success) {
                        previewEl.innerHTML = `
                            <pre class="text-xs font-mono text-gray-800 overflow-x-auto">${JSON.stringify(result.data, null, 2)}</pre>
                        `;
                    } else {
                        throw new Error(result.error);
                    }
                } catch (error) {
                    previewEl.innerHTML = `
                        <div class="text-center py-4 text-red-600">
                            <i class="fas fa-exclamation-circle text-2xl mb-2"></i>
                            <p class="text-sm">Failed to load preview</p>
                        </div>
                    `;
                }
            },

            async generate () {
                const count = parseInt(document.getElementById('mock-count-input').value);

                if (count < 1 || count > 1000) {
                    alert('Please enter a number between 1 and 1000');
                    return;
                }

                if (!confirm(`Generate ${count} mock records for ${this.moduleName}?`)) {
                    return;
                }

                // Show loading state
                const modal = document.getElementById('mock-data-modal');
                modal.style.pointerEvents = 'none';
                modal.style.opacity = '0.6';

                try {
                    const response = await fetch('/cms/api/mockdata/generate', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            moduleName: this.moduleName,
                            count: count
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        // Success toast
                        const toast = document.createElement('div');
                        toast.className = 'fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2';
                        toast.innerHTML = `
                            <i class="fas fa-check-circle"></i>
                            <span>Generated ${count} records successfully!</span>
                        `;
                        document.body.appendChild(toast);
                        setTimeout(() => toast.remove(), 3000);

                        // Reload module data
                        if (currentModule) {
                            await currentModule.loadData();
                        }

                        this.hide();
                    } else {
                        throw new Error(result.error);
                    }
                } catch (error) {
                    alert('Failed to generate mock data: ' + error.message);
                } finally {
                    modal.style.pointerEvents = '';
                    modal.style.opacity = '';
                }
            }
        };
    })();
</script>
