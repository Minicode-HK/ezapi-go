<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>API Logger - CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="bg-gray-50">
    <div class="p-3 sm:p-4 md:p-8">
        <!-- Header -->
        <div class="mb-4 sm:mb-6">
            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 sm:gap-4">
                <div class="flex-1 min-w-0">
                    <h2 class="text-xl sm:text-2xl md:text-3xl font-bold text-gray-800 mb-1 flex items-center">
                        <i class="fas fa-list-alt mr-2 text-indigo-600"></i>
                        <span class="truncate">API Request Logger</span>
                    </h2>
                    <p class="text-xs sm:text-sm md:text-base text-gray-600 truncate">Monitor all API requests in
                        real-time</p>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <!-- Auto Refresh Toggle -->
                    <div class="flex items-center gap-2 bg-white rounded-lg shadow px-3 py-2">
                        <i class="fas fa-sync-alt text-gray-600 text-sm"></i>
                        <span class="text-xs sm:text-sm font-medium text-gray-700">Auto</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="auto-refresh-toggle" class="sr-only peer" checked>
                            <div
                                class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-indigo-600">
                            </div>
                        </label>
                    </div>

                    <!-- Export Button -->
                    <button onclick="window.apiLogger.exportLogs()"
                        class="px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors flex items-center text-sm whitespace-nowrap">
                        <i class="fas fa-download text-sm"></i>
                        <span class="ml-1.5 hidden sm:inline">Export</span>
                    </button>

                    <!-- Clear Button -->
                    <button onclick="window.apiLogger.clearLogs()"
                        class="px-3 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors flex items-center text-sm whitespace-nowrap">
                        <i class="fas fa-trash text-sm"></i>
                        <span class="ml-1.5 hidden sm:inline">Clear</span>
                    </button>

                    <!-- Refresh Button -->
                    <button onclick="window.apiLogger.loadLogs()"
                        class="px-3 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors flex items-center text-sm whitespace-nowrap">
                        <i class="fas fa-sync-alt text-sm"></i>
                        <span class="ml-1.5 hidden sm:inline">Refresh</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4 mb-4 sm:mb-6">
            <div class="bg-white rounded-lg shadow p-3 sm:p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase">Total Requests</p>
                        <p id="stat-total" class="text-xl sm:text-2xl font-bold text-gray-800">0</p>
                    </div>
                    <i class="fas fa-chart-line text-2xl sm:text-3xl text-indigo-600 opacity-20"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-3 sm:p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase">Avg Duration</p>
                        <p id="stat-avg-duration" class="text-xl sm:text-2xl font-bold text-indigo-600">0ms</p>
                    </div>
                    <i class="fas fa-clock text-2xl sm:text-3xl text-indigo-600 opacity-20"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-3 sm:p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase">Success Rate</p>
                        <p id="stat-success-rate" class="text-xl sm:text-2xl font-bold text-green-600">0%</p>
                    </div>
                    <i class="fas fa-check-circle text-2xl sm:text-3xl text-green-600 opacity-20"></i>
                </div>
            </div>

            <div class="bg-white rounded-lg shadow p-3 sm:p-4">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-xs text-gray-500 uppercase">Errors</p>
                        <p id="stat-errors" class="text-xl sm:text-2xl font-bold text-red-600">0</p>
                    </div>
                    <i class="fas fa-exclamation-triangle text-2xl sm:text-3xl text-red-600 opacity-20"></i>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-lg shadow p-3 sm:p-4 mb-4 sm:mb-6">
            <div class="flex flex-col sm:flex-row gap-2 sm:gap-3">
                <div class="flex-1">
                    <input type="text" id="filter-search" placeholder="Search path..."
                        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                </div>

                <select id="filter-method"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Methods</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PUT">PUT</option>
                    <option value="DELETE">DELETE</option>
                    <option value="PATCH">PATCH</option>
                </select>

                <select id="filter-status"
                    class="px-3 py-2 text-sm border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
                    <option value="">All Status</option>
                    <option value="2xx">2xx Success</option>
                    <option value="4xx">4xx Client Error</option>
                    <option value="5xx">5xx Server Error</option>
                </select>

                <button onclick="window.apiLogger.applyFilters()"
                    class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors text-sm whitespace-nowrap">
                    <i class="fas fa-filter mr-1"></i>
                    Filter
                </button>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Time
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Method
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Path
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Status
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Duration
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Size
                            </th>
                            <th
                                class="px-3 sm:px-4 py-2 sm:py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody id="logs-table-body" class="bg-white divide-y divide-gray-200">
                        <!-- Logs will be inserted here -->
                    </tbody>
                </table>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="text-center py-12 hidden">
                <i class="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                <p class="text-gray-500 text-lg">No API requests logged yet</p>
                <p class="text-gray-400 text-sm mt-2">Make some API calls to see them here</p>
            </div>
        </div>
    </div>

    <!-- Log Detail Modal -->
    <div id="log-detail-modal"
        class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-[95vh] overflow-hidden flex flex-col">
            <!-- Modal Header -->
            <div
                class="bg-gradient-to-r from-gray-700 to-indigo-900 px-4 sm:px-6 py-3 sm:py-4 flex items-center justify-between flex-shrink-0">
                <h3 class="text-base sm:text-xl font-bold text-white flex items-center">
                    <i class="fas fa-info-circle mr-2 text-sm sm:text-base"></i>
                    Request Details
                </h3>
                <button onclick="window.apiLogger.closeDetail()"
                    class="text-white hover:text-gray-200 flex-shrink-0 ml-2">
                    <i class="fas fa-times text-lg sm:text-xl"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="flex-1 overflow-y-auto p-4 sm:p-6">
                <div id="log-detail-content" class="space-y-4">
                    <!-- Content will be inserted here -->
                </div>
            </div>

            <!-- Modal Footer -->
            <div
                class="border-t border-gray-200 px-4 sm:px-6 py-3 sm:py-4 flex justify-end gap-2 sm:gap-3 flex-shrink-0">
                <button onclick="window.apiLogger.closeDetail()"
                    class="px-3 sm:px-4 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 transition-colors text-sm">
                    Close
                </button>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const state = {
                logs: [],
                autoRefresh: true,
                refreshInterval: null,
                filters: {
                    search: '',
                    method: '',
                    status: ''
                }
            };

            async function loadLogs () {
                try {
                    const response = await fetch('/cms/api/logger/logs');
                    const result = await response.json();

                    if (result.success) {
                        state.logs = result.data.logs || [];
                        renderLogs();
                        updateStats();
                    }
                } catch (error) {
                    console.error('Failed to load logs:', error);
                }
            }

            async function loadStats () {
                try {
                    const response = await fetch('/cms/api/logger/stats');
                    const result = await response.json();

                    if (result.success) {
                        const stats = result.data;
                        document.getElementById('stat-total').textContent = stats.total || 0;
                        document.getElementById('stat-avg-duration').textContent = (stats.avgDuration || 0) + 'ms';

                        // Calculate success rate
                        const successCount = (stats.statusCodes && stats.statusCodes[200]) || 0;
                        const successRate = stats.total > 0 ? Math.round((successCount / stats.total) * 100) : 0;
                        document.getElementById('stat-success-rate').textContent = successRate + '%';

                        // Count errors (4xx and 5xx)
                        let errorCount = 0;
                        if (stats.statusCodes) {
                            Object.keys(stats.statusCodes).forEach(code => {
                                if (parseInt(code) >= 400) {
                                    errorCount += stats.statusCodes[code];
                                }
                            });
                        }
                        document.getElementById('stat-errors').textContent = errorCount;
                    }
                } catch (error) {
                    console.error('Failed to load stats:', error);
                }
            }

            function updateStats () {
                loadStats();
            }

            function renderLogs () {
                const tbody = document.getElementById('logs-table-body');
                const emptyState = document.getElementById('empty-state');

                let filteredLogs = state.logs;

                // Apply filters
                if (state.filters.search) {
                    filteredLogs = filteredLogs.filter(log =>
                        log.path.toLowerCase().includes(state.filters.search.toLowerCase())
                    );
                }

                if (state.filters.method) {
                    filteredLogs = filteredLogs.filter(log => log.method === state.filters.method);
                }

                if (state.filters.status) {
                    const statusPrefix = state.filters.status.charAt(0);
                    filteredLogs = filteredLogs.filter(log =>
                        Math.floor(log.statusCode / 100).toString() === statusPrefix
                    );
                }

                if (filteredLogs.length === 0) {
                    tbody.innerHTML = '';
                    emptyState.classList.remove('hidden');
                    return;
                }

                emptyState.classList.add('hidden');

                tbody.innerHTML = filteredLogs.map(log => `
                    <tr class="hover:bg-gray-50 cursor-pointer" onclick="window.apiLogger.showDetail('${log.id}')">
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap text-xs sm:text-sm text-gray-700">
                            ${formatTime(log.timestamp)}
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs font-semibold rounded ${getMethodClass(log.method)}">
                                ${log.method}
                            </span>
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 text-xs sm:text-sm text-gray-900 font-mono truncate max-w-xs">
                            ${log.path}
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap">
                            <span class="px-2 py-1 text-xs font-semibold rounded ${getStatusClass(log.statusCode)}">
                                ${log.statusCode}
                            </span>
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap text-xs sm:text-sm text-gray-700">
                            ${log.duration}ms
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap text-xs sm:text-sm text-gray-700">
                            ${formatBytes(log.responseSize)}
                        </td>
                        <td class="px-3 sm:px-4 py-2 sm:py-3 whitespace-nowrap text-xs sm:text-sm">
                            <button onclick="event.stopPropagation(); window.apiLogger.showDetail('${log.id}')"
                                class="text-indigo-600 hover:text-indigo-800">
                                <i class="fas fa-eye"></i>
                            </button>
                        </td>
                    </tr>
                `).join('');
            }

            function showDetail (id) {
                const log = state.logs.find(l => l.id === id);
                if (!log) return;

                const content = document.getElementById('log-detail-content');
                content.innerHTML = `
                    <!-- Overview -->
                    <div class="bg-gray-50 rounded-lg p-4">
                        <h4 class="font-semibold text-gray-800 mb-3 flex items-center">
                            <i class="fas fa-info-circle mr-2 text-indigo-600"></i>
                            Overview
                        </h4>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <span class="text-xs text-gray-500">Method:</span>
                                <span class="ml-2 px-2 py-1 text-xs font-semibold rounded ${getMethodClass(log.method)}">
                                    ${log.method}
                                </span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">Status:</span>
                                <span class="ml-2 px-2 py-1 text-xs font-semibold rounded ${getStatusClass(log.statusCode)}">
                                    ${log.statusCode} ${log.status}
                                </span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">Duration:</span>
                                <span class="ml-2 text-sm font-medium">${log.duration}ms</span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">Size:</span>
                                <span class="ml-2 text-sm font-medium">${formatBytes(log.responseSize)}</span>
                            </div>
                            <div class="col-span-2">
                                <span class="text-xs text-gray-500">Path:</span>
                                <span class="ml-2 text-sm font-mono break-all">${log.path}</span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">Client IP:</span>
                                <span class="ml-2 text-sm font-mono">${log.clientIP}</span>
                            </div>
                            <div>
                                <span class="text-xs text-gray-500">Time:</span>
                                <span class="ml-2 text-sm">${new Date(log.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                    </div>

                    <!-- Request Headers -->
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-2 flex items-center">
                            <i class="fas fa-arrow-up mr-2 text-indigo-600"></i>
                            Request Headers
                        </h4>
                        <div class="bg-gray-900 rounded-lg p-3 overflow-x-auto">
                            <pre class="text-xs font-mono text-green-400">${formatHeaders(log.requestHeaders)}</pre>
                        </div>
                    </div>

                    <!-- Request Body -->
                    ${log.requestBody ? `
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-2 flex items-center">
                            <i class="fas fa-code mr-2 text-indigo-600"></i>
                            Request Body
                        </h4>
                        <div class="bg-gray-900 rounded-lg p-3 overflow-x-auto max-h-64 overflow-y-auto">
                            <pre class="text-xs font-mono text-yellow-400">${formatJSON(log.requestBody)}</pre>
                        </div>
                    </div>
                    ` : ''}

                    <!-- Response Headers -->
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-2 flex items-center">
                            <i class="fas fa-arrow-down mr-2 text-indigo-600"></i>
                            Response Headers
                        </h4>
                        <div class="bg-gray-900 rounded-lg p-3 overflow-x-auto">
                            <pre class="text-xs font-mono text-green-400">${formatHeaders(log.responseHeaders)}</pre>
                        </div>
                    </div>

                    <!-- Response Body -->
                    <div>
                        <h4 class="font-semibold text-gray-800 mb-2 flex items-center">
                            <i class="fas fa-file-code mr-2 text-indigo-600"></i>
                            Response Body
                        </h4>
                        <div class="bg-gray-900 rounded-lg p-3 overflow-x-auto max-h-64 overflow-y-auto">
                            <pre class="text-xs font-mono text-gray-200">${formatJSON(log.responseBody)}</pre>
                        </div>
                    </div>

                    ${log.error ? `
                    <!-- Error -->
                    <div class="bg-red-50 border border-red-200 rounded-lg p-4">
                        <h4 class="font-semibold text-red-800 mb-2 flex items-center">
                            <i class="fas fa-exclamation-triangle mr-2"></i>
                            Error
                        </h4>
                        <p class="text-sm text-red-600 font-mono">${log.error}</p>
                    </div>
                    ` : ''}
                `;

                document.getElementById('log-detail-modal').classList.remove('hidden');
            }

            function closeDetail () {
                document.getElementById('log-detail-modal').classList.add('hidden');
            }

            async function clearLogs () {
                if (!confirm('Are you sure you want to clear all logs?')) return;

                try {
                    const response = await fetch('/cms/api/logger/logs', {
                        method: 'DELETE'
                    });

                    const result = await response.json();
                    if (result.success) {
                        state.logs = [];
                        renderLogs();
                        updateStats();
                    }
                } catch (error) {
                    console.error('Failed to clear logs:', error);
                    alert('Failed to clear logs');
                }
            }

            async function exportLogs () {
                try {
                    window.open('/cms/api/logger/export', '_blank');
                } catch (error) {
                    console.error('Failed to export logs:', error);
                    alert('Failed to export logs');
                }
            }

            function applyFilters () {
                state.filters.search = document.getElementById('filter-search').value;
                state.filters.method = document.getElementById('filter-method').value;
                state.filters.status = document.getElementById('filter-status').value;
                renderLogs();
            }

            function toggleAutoRefresh () {
                const toggle = document.getElementById('auto-refresh-toggle');
                state.autoRefresh = toggle.checked;

                if (state.autoRefresh) {
                    startAutoRefresh();
                } else {
                    stopAutoRefresh();
                }
            }

            function startAutoRefresh () {
                if (state.refreshInterval) return;

                state.refreshInterval = setInterval(() => {
                    loadLogs();
                }, 5000); // Refresh every 5 seconds
            }

            function stopAutoRefresh () {
                if (state.refreshInterval) {
                    clearInterval(state.refreshInterval);
                    state.refreshInterval = null;
                }
            }

            // Helper functions
            function formatTime (timestamp) {
                const date = new Date(timestamp);
                return date.toLocaleTimeString();
            }

            function formatBytes (bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
            }

            function getMethodClass (method) {
                const classes = {
                    'GET': 'bg-blue-100 text-blue-800',
                    'POST': 'bg-green-100 text-green-800',
                    'PUT': 'bg-yellow-100 text-yellow-800',
                    'DELETE': 'bg-red-100 text-red-800',
                    'PATCH': 'bg-purple-100 text-purple-800'
                };
                return classes[method] || 'bg-gray-100 text-gray-800';
            }

            function getStatusClass (statusCode) {
                if (statusCode >= 200 && statusCode < 300) {
                    return 'bg-green-100 text-green-800';
                } else if (statusCode >= 400 && statusCode < 500) {
                    return 'bg-yellow-100 text-yellow-800';
                } else if (statusCode >= 500) {
                    return 'bg-red-100 text-red-800';
                }
                return 'bg-gray-100 text-gray-800';
            }

            function formatHeaders (headers) {
                return Object.entries(headers)
                    .map(([key, value]) => `${key}: ${value}`)
                    .join('\n');
            }

            function formatJSON (str) {
                try {
                    const obj = JSON.parse(str);
                    return JSON.stringify(obj, null, 2);
                } catch {
                    return str;
                }
            }

            function init () {
                loadLogs();

                const toggle = document.getElementById('auto-refresh-toggle');
                toggle.addEventListener('change', toggleAutoRefresh);

                // Start auto-refresh if enabled
                if (state.autoRefresh) {
                    startAutoRefresh();
                }

                // Add filter listeners
                document.getElementById('filter-search').addEventListener('input', applyFilters);
                document.getElementById('filter-method').addEventListener('change', applyFilters);
                document.getElementById('filter-status').addEventListener('change', applyFilters);
            }

            window.apiLogger = {
                init,
                loadLogs,
                showDetail,
                closeDetail,
                clearLogs,
                exportLogs,
                applyFilters
            };

            init();
        })();
    </script>
</body>

</html>
