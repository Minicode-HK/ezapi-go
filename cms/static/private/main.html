<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZAPI CMS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Load global manager only -->
    <script src="/cms/static/admin/cms-manager.js"></script>
    <script>
        let currentModule;
    </script>
    <script src="/cms/static/admin/cms-module.js"></script>
</head>

<body class="bg-gray-100">
    <!-- Top Navigation Bar (Mobile) -->
    <nav class="cursor-pointer lg:hidden fixed top-0 left-0 right-0 bg-gray-800 text-white shadow-lg z-50">
        <div class="flex items-center justify-between p-4">
            <div class="flex items-center space-x-2">
                <img src="https://temp.r2.minicodehk.com/minicodehk_dark_no_bg.png" alt="Logo" class="h-8">
                <h1 class="text-lg font-bold">EZAPI CMS</h1>
            </div>
            <button id="mobile-menu-btn" class="text-white hover:text-gray-300 transition-colors">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </div>
    </nav>

    <div class="flex h-screen overflow-hidden pt-16 lg:pt-0">
        <!-- Backdrop for mobile -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden"></div>

        <!-- Sidebar -->
        <aside id="sidebar"
            class="fixed lg:static inset-y-0 left-0 z-40 w-64 bg-gray-800 text-white flex flex-col transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out">

            <!-- Header (Desktop only) -->
            <div class="hidden lg:flex p-4 border-b border-gray-700 items-center justify-between">
                <div class="flex items-center space-x-2">
                    <img src="https://temp.r2.minicodehk.com/minicodehk_dark_no_bg.png" alt="Logo" class="h-8">
                    <h1 class="text-xl font-bold border-l border-gray-600 pl-2">
                        EZAPI CMS
                    </h1>
                </div>
            </div>

            <!-- Close button for mobile -->
            <div class="lg:hidden flex items-center justify-between p-4 border-b border-gray-700">
                <span class="text-sm font-semibold text-gray-400">MENU</span>
                <button id="mobile-menu-close" class="text-gray-400 hover:text-white">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Navigation -->
            <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mt-4">
                System
            </div>
            <nav class="flex-1 overflow-y-auto">
                <a href="#" hx-get="/cms/api/content/dashboard" hx-target="#main-content" hx-swap="innerHTML"
                    class="nav-link block px-4 py-2 hover:bg-gray-700 transition-colors">
                    <i class="fas fa-home mr-2"></i> Dashboard
                </a>
                <a href="#" hx-get="/cms/api/content/snapshot" hx-target="#main-content" hx-swap="innerHTML"
                    class="nav-link block px-4 py-2 hover:bg-gray-700 transition-colors">
                    <i class="fas fa-camera mr-2"></i> Snapshots
                </a>
                <a href="#" hx-get="/cms/api/content/system_routes" hx-target="#main-content" hx-swap="innerHTML"
                    class="nav-link block px-4 py-2 hover:bg-gray-700 transition-colors">
                    <i class="fas fa-route mr-2"></i> System Routes
                </a>
                <a href="#" hx-get="/cms/api/content/playground" hx-target="#main-content" hx-swap="innerHTML"
                    class="nav-link block px-4 py-2 hover:bg-gray-700 transition-colors">
                    <i class="fas fa-play-circle mr-2"></i> API Playground
                </a>

                <div class="px-4 py-2 text-xs font-semibold text-gray-400 uppercase tracking-wider mt-4">
                    Data Models
                </div>
                <div id="sidebar-nav">
                    <!-- Dynamic navigation will be inserted here -->
                </div>
            </nav>

            <!-- User Info & Actions -->
            <div class="p-4 border-t border-gray-700 space-y-2 mt-auto">
                <div class="flex items-center text-sm text-gray-300 mb-3">
                    <i class="fas fa-user-circle text-xl mr-2"></i>
                    <span id="username-display" class="font-medium">Loading...</span>
                </div>

                <button id="logout-btn" style="cursor: pointer;"
                    class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="main-content" class="flex-1 overflow-y-auto">
            <!-- Content will be loaded here via htmx -->
        </main>
    </div>

    <script>
        // Mobile menu toggle
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const menuBtn = document.getElementById('mobile-menu-btn');
        const closeBtn = document.getElementById('mobile-menu-close');

        function openSidebar () {
            sidebar.classList.remove('-translate-x-full');
            backdrop.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar () {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
            document.body.style.overflow = '';
        }

        if (menuBtn) menuBtn.addEventListener('click', openSidebar);
        if (closeBtn) closeBtn.addEventListener('click', closeSidebar);
        if (backdrop) backdrop.addEventListener('click', closeSidebar);

        // Close sidebar on navigation (mobile only)
        document.addEventListener('htmx:afterOnLoad', function (event) {
            // Highlight active nav item
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.remove('bg-gray-700');
            });

            if (event.detail.elt && event.detail.elt.classList.contains('nav-link')) {
                event.detail.elt.classList.add('bg-gray-700');

                // Close sidebar on mobile after navigation
                if (window.innerWidth < 1024) {
                    closeSidebar();
                }
            }
        });

        // Load dashboard by default
        window.addEventListener('load', () => {
            htmx.ajax('GET', '/cms/api/content/dashboard', { target: '#main-content' });
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth >= 1024) {
                // Desktop: ensure sidebar is visible and backdrop is hidden
                sidebar.classList.remove('-translate-x-full');
                backdrop.classList.add('hidden');
                document.body.style.overflow = '';
            } else {
                // Mobile: ensure sidebar is hidden by default
                if (!sidebar.classList.contains('-translate-x-full')) {
                    closeSidebar();
                }
            }
        });
    </script>
</body>

</html>
