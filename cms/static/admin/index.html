<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZAPI CMS</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        function resetAllData () {
            if (confirm('Are you sure you want to reset all data? This action cannot be undone.')) {
                fetch('/api/reset', {
                    method: 'POST',
                    credentials: 'include'
                }).then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            alert('All data has been reset.');
                            location.reload();
                        } else {
                            alert('Error resetting data: ' + result.message);
                        }
                    })
                    .catch(error => {
                        alert('Network error: ' + error.message);
                    });
            }
        }
    </script>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 text-white flex flex-col">
            <div class="p-4 border-b border-gray-700">
                <h1 class="text-xl font-bold">
                    <i class="fas fa-cog mr-2"></i>EZAPI CMS
                </h1>
            </div>

            <nav id="sidebar-nav" class="flex-1 overflow-y-auto mt-4">
                <!-- Dynamic navigation will be inserted here -->
            </nav>

            <!-- User Info & Actions -->
            <div class="p-4 border-t border-gray-700 space-y-2">
                <div class="flex items-center text-sm text-gray-300 mb-3">
                    <i class="fas fa-user-circle text-xl mr-2"></i>
                    <span id="username-display" class="font-medium">Loading...</span>
                </div>

                <button id="logout-btn"
                    class="w-full bg-gray-700 hover:bg-gray-600 text-white py-2 px-4 rounded transition-colors">
                    <i class="fas fa-sign-out-alt mr-2"></i> Logout
                </button>

                <button id="reset-button" onclick="resetAllData()"
                    class="w-full bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded transition-colors">
                    <i class="fas fa-rotate-left mr-2"></i> Reset All Data
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto">
            <!-- Header -->
            <header class="bg-white shadow-sm px-8 py-4">
                <div class="flex justify-between items-center">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800" id="page-title">Dashboard</h2>
                        <p class="text-sm text-gray-600 mt-1" id="page-subtitle">Manage your content</p>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="p-8">
                <div id="content-area">
                    <div class="bg-white rounded-lg shadow-sm p-8 text-center">
                        <i class="fas fa-database text-6xl text-gray-800 mb-4"></i>
                        <h2 class="text-2xl font-bold mb-4 text-gray-800">Welcome to EZAPI CMS</h2>
                        <p class="text-gray-600">Select a module from the sidebar to begin managing your content.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/cms/static/admin/cms.js"></script>
</body>

</html>
