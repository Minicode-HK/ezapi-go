<div x-data="resourceController" class="h-full flex flex-col">
    
    <!-- Header -->
    <div class="flex justify-between items-center mb-6" x-show="$store.cms.currentResource">
        <div>
            <h2 class="text-2xl font-bold text-gray-800" x-text="$store.cms.currentResource.name"></h2>
            <div class="badge badge-ghost gap-2 mt-1" x-text="$store.cms.currentResource.endpoint"></div>
        </div>
        <button class="btn btn-primary btn-sm" @click="openCreateModal">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
            Create New
        </button>
    </div>

    <!-- Content -->
    <div class="flex-1 overflow-hidden bg-white shadow-sm rounded-sm border border-gray-200 flex flex-col">
        <div class="overflow-auto flex-1 relative">
            
            <!-- Loading Overlay -->
            <div x-show="loading" class="absolute inset-0 bg-white/60 z-10 flex items-center justify-center">
                <span class="loading loading-spinner loading-lg text-primary"></span>
            </div>

            <table class="table table-zebra w-full table-pin-rows" x-show="$store.cms.currentResource">
                <thead>
                    <tr>
                        <template x-for="field in visibleFields()" :key="field.key"><th x-text="field.name"></th></template>
                        <th class="text-right">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr x-show="items.length === 0"><td :colspan="visibleFields().length + 1" class="text-center py-12 text-gray-500">No records found</td></tr>
                    <template x-for="item in items" :key="item.id">
                        <tr class="hover">
                            <template x-for="field in visibleFields()" :key="field.key">
                                <td class="max-w-xs truncate text-gray-700">
                                    <span x-show="field.type === 'checkbox'"><input type="checkbox" class="checkbox checkbox-xs checkbox-primary" :checked="item[field.key]" disabled /></span>
                                    <span x-show="field.type !== 'checkbox'" x-text="typeof item[field.key] === 'object' ? JSON.stringify(item[field.key]) : item[field.key]"></span>
                                </td>
                            </template>
                            <td class="text-right space-x-2">
                                <button class="btn btn-xs btn-ghost text-blue-600" @click="editItem(item)">Edit</button>
                                <button class="btn btn-xs btn-ghost text-red-600" @click="openDeleteConfirm(item)">Delete</button>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
            
            <div x-show="!$store.cms.currentResource" class="flex flex-col items-center justify-center h-full text-gray-400">
                <p>Select a module to view data</p>
            </div>
        </div>
    </div>

    <!-- Editor Modal -->
    <dialog id="res_editor_modal" class="modal">
        <div class="modal-box w-11/12 max-w-3xl p-0 bg-white">
            <div class="bg-gray-100 px-6 py-4 border-b border-gray-200">
                <h3 class="font-bold text-lg text-gray-800"><span x-text="isEditing ? 'Edit' : 'Create'"></span></h3>
            </div>
            <div class="p-6 max-h-[60vh] overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <template x-for="field in $store.cms.currentResource?.fields || []" :key="field.key">
                        <div class="form-control">
                            <label class="label px-0 pt-0 mb-1"><span class="label-text font-medium text-gray-700" x-text="field.name"></span></label>
                            <input x-show="field.read_only" :value="typeof formData[field.key] === 'object' ? JSON.stringify(formData[field.key]) : formData[field.key]" disabled class="input input-bordered w-full bg-gray-100" />
                            <div x-show="!field.read_only && field.type === 'checkbox'" class="flex items-center h-12">
                                <label class="label cursor-pointer justify-start gap-3"><input type="checkbox" x-model="formData[field.key]" class="checkbox checkbox-primary" /><span class="label-text">Enabled</span></label>
                            </div>
                            <input x-show="!field.read_only && field.type === 'number'" type="number" x-model.number="formData[field.key]" class="input input-bordered w-full" />
                            <input x-show="!field.read_only && field.type !== 'checkbox' && field.type !== 'number'" type="text" x-model="formData[field.key]" class="input input-bordered w-full" />
                        </div>
                    </template>
                </div>
            </div>
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end">
                <form method="dialog"><button class="btn btn-ghost hover:bg-gray-200 mr-2">Cancel</button><button class="btn btn-primary" @click.prevent="saveItem">Save</button></form>
            </div>
        </div>
    </dialog>

    <!-- Delete Modal -->
    <dialog id="res_delete_modal" class="modal">
        <div class="modal-box w-full max-w-sm p-0 bg-white">
            <div class="p-6"><p>Are you sure you want to delete this item?</p></div>
            <div class="bg-gray-50 px-6 py-4 border-t border-gray-200 flex justify-end gap-2">
                <form method="dialog"><button class="btn btn-ghost">Cancel</button></form>
                <button class="btn btn-error text-white" @click="confirmDelete">Delete</button>
            </div>
        </div>
    </dialog>
</div>
