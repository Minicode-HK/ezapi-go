<div x-data="snapshotController" class="space-y-6">
    <!-- Header -->
    <div class="flex justify-between items-center">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">System Snapshots</h2>
            <p class="text-sm text-gray-500 mt-1">Create and restore database backups.</p>
        </div>
        <button class="btn btn-primary btn-sm" @click="createSnapshot" :disabled="loading">
            <span x-show="loading" class="loading loading-spinner loading-xs"></span>
            Create Snapshot
        </button>
    </div>

    <!-- Table -->
    <div class="bg-white shadow-sm rounded-sm border border-gray-200">
        <table class="table table-zebra w-full">
            <thead>
                <tr>
                    <th>Filename</th>
                    <th>Size</th>
                    <th>Modules</th>
                    <th>Created</th>
                    <th class="text-right">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr x-show="snapshots.length === 0">
                    <td colspan="5" class="text-center py-12 text-gray-500">No snapshots available</td>
                </tr>
                <template x-for="snap in snapshots" :key="snap.id">
                    <tr class="hover">
                        <td class="font-mono text-xs font-bold" x-text="snap.name"></td>
                        <td class="text-xs" x-text="formatBytes(snap.size)"></td>
                        <td>
                            <div class="flex gap-1 flex-wrap">
                                <template x-for="mod in (snap.modules || []).slice(0, 3)">
                                    <span class="badge badge-xs badge-ghost" x-text="mod"></span>
                                </template>
                                <span x-show="(snap.modules || []).length > 3" class="badge badge-xs badge-ghost" x-text="'+' + ((snap.modules || []).length - 3)"></span>
                            </div>
                        </td>
                        <td class="text-xs text-gray-500" x-text="new Date(snap.created_at).toLocaleString()"></td>
                        <td class="text-right space-x-1">
                            <button class="btn btn-xs btn-ghost" @click="viewSnapshot(snap)" :disabled="loading">
                                📄 View
                            </button>
                            <button class="btn btn-xs btn-warning btn-outline" @click="restoreSnapshot(snap)" :disabled="loading">
                                ♻️ Restore
                            </button>
                            <button class="btn btn-xs btn-ghost text-red-600" @click="deleteSnapshot(snap)" :disabled="loading">
                                🗑️
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- View Content Modal -->
    <dialog id="snapshot_modal" class="modal">
        <div class="modal-box w-11/12 max-w-6xl h-5/6 flex flex-col p-0 overflow-hidden">
            <!-- Modal Header -->
            <div class="bg-gray-100 px-6 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg">
                    <span x-show="!selectedModule">Snapshot Content</span>
                    <span x-show="selectedModule" class="flex items-center gap-2">
                        <button @click="selectedModule = null" class="btn btn-xs btn-ghost">←</button>
                        <span x-text="selectedModule"></span>
                    </span>
                </h3>
                <form method="dialog">
                    <button class="btn btn-sm btn-circle btn-ghost">✕</button>
                </form>
            </div>
            
            <!-- Modal Body -->
            <div class="flex-1 overflow-hidden flex flex-col p-6 gap-4">
                <!-- Module Summary -->
                <div x-show="viewData && !selectedModule">
                    <div class="text-xs font-bold text-gray-500 uppercase mb-2">Included Modules</div>
                    <div class="flex flex-wrap gap-2">
                        <template x-for="key in Object.keys(viewData || {})">
                            <button @click="selectedModule = key" class="badge badge-neutral badge-lg cursor-pointer hover:badge-primary" x-text="key"></button>
                        </template>
                    </div>
                </div>

                <!-- Module Content -->
                <div x-show="selectedModule" class="flex-1 bg-gray-900 rounded-lg overflow-auto p-4 shadow-inner">
                    <pre class="text-xs font-mono text-green-400 leading-relaxed" x-text="JSON.stringify((viewData ?? {})[selectedModule], null, 2)"></pre>
                </div>

                <!-- JSON Content (Full View) -->
                <div x-show="viewData && !selectedModule" class="flex-1 bg-gray-900 rounded-lg overflow-auto p-4 shadow-inner">
                    <pre class="text-xs font-mono text-green-400 leading-relaxed" x-text="JSON.stringify((viewData ?? {}), null, 2)"></pre>
                </div>
            </div>
        </div>
        <form method="dialog" class="modal-backdrop">
            <button>close</button>
        </form>
    </dialog>
</div>
